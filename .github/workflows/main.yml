name: Compilar Mi EQ

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release --parallel
      - run: |
          mkdir dist
          xcopy "build\MiEQ_artefacts\Release\VST3\Mi EQ.vst3" "dist\Mi EQ.vst3\" /E /I /Y
      - uses: actions/upload-artifact@v4
        with:
          name: MiEQ-VST3-Windows
          path: dist
